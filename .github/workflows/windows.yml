# usage-hud 윈도우판을 점검하고 실제로 띄워 봄. 파이썬이라 빌드는 없고, 뜨다가 죽지 않는지가 그 자리다.
# private 저장소에서 윈도우 러너는 1분이 무료 한도 2분으로 잡혀서, HUD 가 읽는 파일이 바뀔 때만 돈다
name: windows
on:
  push:
    paths: [usage-hud/*.py, usage-hud/*.html, shared/**, .github/workflows/windows.yml]
  pull_request:
    paths: [usage-hud/*.py, usage-hud/*.html, shared/**, .github/workflows/windows.yml]
  workflow_dispatch:
env:
  PYTHONUTF8: '1'
jobs:
  hud:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python usage-hud/usage.py --check
      - run: python shared/startup.py
      # 8초 띄워 둔 뒤 살아 있으면 --stop 으로 치움. 그 전에 죽었으면 오류를 보이고 실패
      - name: HUD 띄워 보기
        run: |
          $p = Start-Process python -ArgumentList 'usage-hud/hud.py' -PassThru -RedirectStandardError hud.err
          $null = $p.Handle  # 먼저 잡아 두지 않으면 끝난 뒤 ExitCode 가 빈다
          Start-Sleep 8
          if ($p.HasExited) { Get-Content hud.err; throw "HUD 가 뜨다 죽음 (종료 코드 $($p.ExitCode))" }
          python usage-hud/hud.py --stop
          if (-not $p.WaitForExit(10000)) { throw "--stop 으로 안 꺼짐" }
          Get-Content hud.err
      # HUD 메뉴의 '페이지 열기' 가 띄우는 서버
      - name: 페이지 서버 띄워 보기
        run: |
          $p = Start-Process python -ArgumentList 'usage-hud/page.py', '--no-open', '--port', '8765' -PassThru -RedirectStandardError page.err
          $null = $p.Handle
          Start-Sleep 4
          if ($p.HasExited) { Get-Content page.err; throw "페이지 서버가 뜨다 죽음 (종료 코드 $($p.ExitCode))" }
          try {
            $html = Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing
            $data = Invoke-RestMethod http://127.0.0.1:8765/data.json
            if ($null -eq $data.bars) { throw "data.json 에 bars 가 없음" }
            "페이지 $($html.Content.Length)자 · 데이터 칸 $(($data.PSObject.Properties.Name | Sort-Object) -join ', ')"
          } finally { Stop-Process -Id $p.Id }
