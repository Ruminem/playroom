# sysmon 을 점검하고 실제로 띄워 봄. 파이썬이라 빌드는 없고, 뜨다가 죽지 않는지가 그 자리다.
# private 저장소에서 윈도우 러너는 1분이 무료 한도 2분으로 잡혀서, sysmon 이 읽는 파일이 바뀔 때만 돈다
name: sysmon
on:
  push:
    paths: [sysmon/**, shared/**, .github/workflows/sysmon.yml]
  pull_request:
    paths: [sysmon/**, shared/**, .github/workflows/sysmon.yml]
  workflow_dispatch:
env:
  PYTHONUTF8: '1'
jobs:
  sysmon:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python sysmon/sysmon.py --check
      # 8초 띄워 둔 뒤 살아 있으면 --stop 으로 치움. 그 전에 죽었으면 오류를 보이고 실패
      - name: sysmon 띄워 보기
        run: |
          $p = Start-Process python -ArgumentList 'sysmon/sysmon.py' -PassThru -RedirectStandardError run.err
          $null = $p.Handle  # 먼저 잡아 두지 않으면 끝난 뒤 ExitCode 가 빈다
          Start-Sleep 8
          if ($p.HasExited) { Get-Content run.err; throw "sysmon 이 뜨다 죽음 (종료 코드 $($p.ExitCode))" }
          python sysmon/sysmon.py --stop
          if (-not $p.WaitForExit(10000)) { throw "--stop 으로 안 꺼짐" }
          Get-Content run.err
