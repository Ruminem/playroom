# 윈도우 도구 다섯을 PyInstaller 로 exe 하나씩 굳혀 띄워 보고, 그 버전 태그의 릴리스에 붙임.
# 노트는 CHANGELOG.md 의 그 버전 절을 그대로 씀 — 그 절이 없으면 굽기 전에 멈춤.
# exe 이름은 스크립트 이름을 따름(hud.py → hud.exe). startup.command 와 런처가 이 이름으로 옆의 exe 를 찾음
# 굳힌 exe 는 PYTHONUTF8 환경 변수를 안 읽어서, 한글을 찍으면 cp1252 로 죽음(2026-10-05 CI). 그래서 UTF-8 모드를 exe 에 박음
# 버전은 CHANGELOG.md 맨 위 절(## x.y.z — 날짜)이고, 그 태그가 아직 없을 때만 굽는다 — 새 절을 써서 main 에 푸시하면 그게 릴리스.
# 굽고 점검한 exe 는 드라이브 Apps/playroom/ 의 같은 도구 파일에 덮어쓰고 <이름>-<버전>.exe 로 이름을 바꾼다 — 같은 파일이라 링크가 그대로임.
# 런처와 시작 시 실행은 옆의 <이름>.exe, 없으면 <이름>-<버전>.exe 중 가장 높은 것을 찾는다(shared/startup.py beside). 릴리스 첨부는 버전 없는 이름.
# 드라이브를 GitHub 릴리스보다 먼저 올리므로, 실패하면 태그가 안 생겨 Actions → release → Run workflow 로 처음부터 다시 돌면 된다.
# 비밀값 RCLONE_CONFIG_GDRIVE_TOKEN·_CLIENT_ID·_CLIENT_SECRET: 로컬 rclone 원격 gdrive(scope drive, 직접 만든 구글 클라우드 client)의 token·client_id·client_secret 줄. 토큰은 그 client 와 짝이라 셋이 같이 바뀌어야 함
name: release
on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:
concurrency: release
permissions:
  contents: write
env:
  PYTHONUTF8: '1'
jobs:
  # 버전 보기만은 리눅스에서 — 릴리스할 게 없으면 윈도우 러너(2배로 셈)를 안 띄움
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          v=$(grep -m1 -oP '^## \K[0-9][^ ]*' CHANGELOG.md)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then echo "v$v 는 이미 나감"; else echo "new=1" >> "$GITHUB_OUTPUT"; fi
  release:
    needs: check
    if: needs.check.outputs.new
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.check.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: CHANGELOG 에서 노트 꺼내기
        run: |
          $c = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($c, "(?ms)^## $([regex]::Escape($env:VERSION)) .*?(?=^## |\z)")
          if (-not $m.Success) { throw "CHANGELOG.md 에 '## $env:VERSION — 날짜' 절이 없음" }
          $m.Value.Trim() | Set-Content notes.md -Encoding utf8
          Get-Content notes.md
      # HUD 메뉴의 작업 표시줄 진단. 러너 화면이 실제 PC 와 달라 내용은 못 보고, 죽지 않고 머리와 마지막 절까지 나오는지만 봄
      - name: 작업 표시줄 진단 돌려 보기
        run: |
          # 한글 비교는 파이썬 안에서 — 파이프로 받은 글은 콘솔 코드 페이지로 읽혀 깨질 수 있음
          python -c "import sys; sys.path.insert(0, 'shared'); import taskbar; r = taskbar.report(); print(r); assert '## 작업 표시줄' in r and '개는 뺌' in r, '빠진 절이 있음'"
          if ($LASTEXITCODE) { throw "taskbar.report() 가 죽거나 절이 빠짐" }
      - run: python -m pip install "pyinstaller>=6.16"
      - name: exe 굽기
        run: |
          $tools = [ordered]@{ launcher = 'launcher/launcher.py'; hud = 'usage-hud/hud.py'; weather = 'weather/weather.py'
                               sysmon = 'sysmon/sysmon.py'; layers = 'layers/layers.py' }
          foreach ($name in $tools.Keys) {
            $extra = if ($name -eq 'hud') { @('--add-data', "$PWD/usage-hud/page.html;.") } else { @() }
            # --specpath 를 build 로 옮기면 상대 경로가 그쪽 기준이 되므로 절대 경로로 넘김
            python -m PyInstaller --noconfirm --onefile --windowed --log-level WARN --name $name --python-option 'X utf8' `
              --paths "$PWD/shared" --distpath dist --workpath build --specpath build @extra $tools[$name]
            if ($LASTEXITCODE) { throw "$name 굽기 실패" }
          }
          Get-ChildItem dist | ForEach-Object { '{0,-14} {1,6:N1} MB' -f $_.Name, ($_.Length / 1MB) }
      # 창 없는 exe 는 잡히지 않은 예외를 대화상자로만 보이고 멈춤. 오류를 읽으려고 콘솔판을 따로 구워(릴리스엔 안 붙임) 점검함
      - name: 콘솔판 weather.exe --check
        run: |
          python -m PyInstaller --noconfirm --onefile --console --log-level WARN --name weather --python-option 'X utf8' `
            --paths "$PWD/shared" --distpath build/console --workpath build/console-work --specpath build/console-work weather/weather.py
          if ($LASTEXITCODE) { throw "콘솔판 굽기 실패" }
          build/console/weather.exe --check
          if ($LASTEXITCODE) { throw "콘솔판 weather.exe --check 실패 (종료 코드 $LASTEXITCODE)" }
      # 창 없는 exe 가 부모가 준 파이프로 stdout 을 쓰는지 — weather 설정 창이 이 길로 누른 것을 돌려보냄
      - name: 창 없는 weather.exe --check (stdout 을 파일로)
        run: |
          $p = Start-Process dist/weather.exe -ArgumentList '--check' -PassThru -RedirectStandardOutput check.out -RedirectStandardError check.err
          $null = $p.Handle
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; throw "60초 안에 안 끝남 — 오류 대화상자에 멈췄을 수 있음" }
          Get-Content check.out, check.err
          if ($p.ExitCode -ne 0 -or -not (Select-String -Quiet '자체 점검 통과' check.out)) { throw "stdout 이 파이프로 안 나감 (종료 코드 $($p.ExitCode))" }
      # 창 없는 exe 는 죽으면 오류 대화상자를 띄운 채 살아 있으므로, 살아 있는 것만 보지 않고 트레이 창이 떴는지 봄.
      # onefile 은 풀어 놓는 데만 몇 초 걸리므로 정해진 시간을 자지 않고 30초까지 1초마다 찾음
      - name: exe 띄워 보기
        run: |
          Add-Type -Namespace U -Name W -MemberDefinition @'
          [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindow(string c, string n);
          // PowerShell 은 string 인자로 넘긴 $null 을 "" 로 바꿔서, 제목 없는 창만 찾게 됨(2026-10-05 CI). null 은 여기서 넘김
          public static bool HasClass(string c) { return FindWindow(c, null) != IntPtr.Zero; }
          public static bool HasTitle(string t) { return FindWindow(null, t) != IntPtr.Zero; }
          public delegate bool EnumProc(IntPtr h, IntPtr l);
          [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc f, IntPtr l);
          [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
          [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetClassName(IntPtr h, System.Text.StringBuilder s, int n);
          [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, System.Text.StringBuilder s, int n);
          public static System.Collections.Generic.List<string> Of(uint[] pids) {
            var r = new System.Collections.Generic.List<string>();
            EnumWindows((h, l) => { uint p; GetWindowThreadProcessId(h, out p);
              if (System.Array.IndexOf(pids, p) >= 0) { var c = new System.Text.StringBuilder(256); var t = new System.Text.StringBuilder(256);
                GetClassName(h, c, 256); GetWindowText(h, t, 256); r.Add(p + " " + c + " '" + t + "'"); }
              return true; }, IntPtr.Zero);
            return r;
          }
          '@
          function Wait-Window([scriptblock]$found) {
            $t = [Diagnostics.Stopwatch]::StartNew()
            while ($t.Elapsed.TotalSeconds -lt 30) {
              if (& $found) { return $t.Elapsed.TotalSeconds }
              Start-Sleep 1
            }
            return $null
          }
          function Show-Windows($proc) {  # 대화상자에 멈췄으면 그 창이 여기 보임
            $ids = [uint32[]]@(Get-Process $proc -ErrorAction SilentlyContinue | ForEach-Object Id)
            "$proc 프로세스 $($ids -join ', ') 의 창:"; [U.W]::Of($ids)
            Get-ChildItem $env:TEMP -Filter 'playroom-*.log' | ForEach-Object { "--- $($_.Name)"; Get-Content $_.FullName -Tail 40 }
          }
          $tray = [ordered]@{ hud = 'PlayroomUsageHudTray'; weather = 'PlayroomWeatherTray'; sysmon = 'PlayroomSysmonTray'; layers = 'PlayroomLayersTray' }
          foreach ($name in $tray.Keys) {
            $p = Start-Process "dist/$name.exe" -PassThru
            $null = $p.Handle  # 먼저 잡아 두지 않으면 끝난 뒤 ExitCode 가 빈다
            $sec = Wait-Window { [U.W]::HasClass($tray[$name]) }
            if ($p.HasExited) { throw "$name.exe 가 뜨다 죽음 (종료 코드 $($p.ExitCode))" }
            if ($null -eq $sec) {
              Show-Windows $name
              # 기준선: 같은 도구를 굳히지 않은 파이썬으로 띄워도 트레이가 없는지
              $src = @{ hud = 'usage-hud/hud.py'; weather = 'weather/weather.py'; sysmon = 'sysmon/sysmon.py'; layers = 'layers/layers.py' }[$name]
              $q = Start-Process python -ArgumentList $src -PassThru
              $base = Wait-Window { [U.W]::HasClass($tray[$name]) }
              "파이썬으로 띄운 $src 의 트레이: $(if ($null -eq $base) { '30초 안에 없음' } else { '{0:N1}초' -f $base })"
              if (-not $q.HasExited) { Stop-Process -Id $q.Id -Force }
              throw "$name.exe 의 트레이 창이 30초 안에 안 뜸"
            }
            "$name.exe 트레이 {0:N1}초" -f $sec
            $s = Start-Process "dist/$name.exe" -ArgumentList '--stop' -PassThru
            if (-not $s.WaitForExit(15000)) { throw "$name.exe --stop 이 안 끝남" }
            if (-not $p.WaitForExit(10000)) { throw "$name.exe 가 --stop 으로 안 꺼짐" }
            "$name.exe 꺼짐"
          }
          $p = Start-Process dist/launcher.exe -PassThru
          $null = $p.Handle
          $sec = Wait-Window { [U.W]::HasTitle('playroom') }
          if ($p.HasExited) { throw "launcher.exe 가 뜨다 죽음 (종료 코드 $($p.ExitCode))" }
          if ($null -eq $sec) { Show-Windows launcher; throw "launcher.exe 창이 30초 안에 안 뜸" }
          "launcher.exe 창 {0:N1}초" -f $sec
          Get-Process launcher | Stop-Process
      # 새로 받은 exe 를 띄우면 떠 있는 옛 버전 exe 가 꺼지고 새것이 이어 뜨는지. 옛것은 버전 붙은 이름으로 복사해 흉내 냄 —
      # dist 에 두면 드라이브·릴리스에 같이 올라가므로 RUNNER_TEMP 에 둠
      - name: 옛 exe 갈아 끼우기
        run: |
          Add-Type -Namespace U -Name W -MemberDefinition @'
          [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindow(string c, string n);
          public static bool HasClass(string c) { return FindWindow(c, null) != IntPtr.Zero; }
          public static bool HasTitle(string t) { return FindWindow(null, t) != IntPtr.Zero; }
          '@
          function Wait-Window([scriptblock]$found) {
            $t = [Diagnostics.Stopwatch]::StartNew()
            while ($t.Elapsed.TotalSeconds -lt 30) {
              if (& $found) { return $t.Elapsed.TotalSeconds }
              Start-Sleep 1
            }
            return $null
          }
          $oldExe = Join-Path $env:RUNNER_TEMP 'weather-0.0.1.exe'
          Copy-Item dist/weather.exe $oldExe
          $old = Start-Process $oldExe -PassThru; $null = $old.Handle
          if ($null -eq (Wait-Window { [U.W]::HasClass('PlayroomWeatherTray') })) { throw "옛 weather 트레이가 안 뜸" }
          $new = Start-Process dist/weather.exe -PassThru; $null = $new.Handle
          if (-not $old.WaitForExit(20000)) { throw "새 weather.exe 를 띄워도 옛 exe 가 안 꺼짐" }
          if ($null -eq (Wait-Window { [U.W]::HasClass('PlayroomWeatherTray') })) { throw "갈아 끼운 뒤 트레이가 안 뜸" }
          if ($new.HasExited) { throw "새 weather.exe 가 죽음 (종료 코드 $($new.ExitCode))" }
          # PID 파일은 onefile 의 자식 프로세스를 가리킴 — 그 실행 파일이 exe 자신이어야 옛것을 알아봄
          $img = (Get-Process -Id ([int](Get-Content (Join-Path $env:TEMP 'playroom-weather.pid')))).Path
          "PID 파일의 프로세스: $img"
          if ($img -ne (Resolve-Path dist/weather.exe).Path) { throw "떠 있는 weather 의 실행 파일이 새 exe 가 아님" }
          $again = Start-Process dist/weather.exe -PassThru; $null = $again.Handle
          if (-not $again.WaitForExit(30000)) { throw "같은 exe 를 다시 띄우면 그냥 끝나야 함" }
          if ($new.HasExited) { throw "같은 exe 를 다시 띄웠더니 떠 있던 것이 꺼짐" }
          "weather 갈아 끼우기 됨"
          $s = Start-Process dist/weather.exe -ArgumentList '--stop' -PassThru
          if (-not $s.WaitForExit(15000)) { throw "weather.exe --stop 이 안 끝남" }
          if (-not $new.WaitForExit(10000)) { throw "weather.exe 가 --stop 으로 안 꺼짐" }

          $oldExe = Join-Path $env:RUNNER_TEMP 'launcher-0.0.1.exe'
          Copy-Item dist/launcher.exe $oldExe
          $old = Start-Process $oldExe -PassThru; $null = $old.Handle
          if ($null -eq (Wait-Window { [U.W]::HasTitle('playroom') })) { throw "옛 launcher 창이 안 뜸" }
          $new = Start-Process dist/launcher.exe -PassThru; $null = $new.Handle
          if (-not $old.WaitForExit(30000)) { throw "새 launcher.exe 를 띄워도 옛 창이 안 닫힘" }
          if ($new.HasExited) { throw "새 launcher.exe 가 죽음 (종료 코드 $($new.ExitCode))" }
          "launcher 갈아 끼우기 됨"
          Get-Process launcher | Stop-Process
      - name: 드라이브에 올리기
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.RCLONE_CONFIG_GDRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.RCLONE_CONFIG_GDRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_CONFIG_GDRIVE_TOKEN }}
        run: |
          $r = 'rclone-v1.75.1-windows-amd64'
          Invoke-WebRequest "https://downloads.rclone.org/v1.75.1/$r.zip" -OutFile "$env:RUNNER_TEMP\rclone.zip"
          # rclone 사이트와 GitHub 릴리스의 SHA256SUMS 값. 바꿔치기된 zip 이 드라이브 토큰을 들고 돌지 않게 함
          if ((Get-FileHash "$env:RUNNER_TEMP\rclone.zip").Hash -ne '200eb602c126d82aa38b51e0f6b9ae837473ff99b51278d3f6f837574c494d6e') { throw 'rclone zip 해시가 다름' }
          Expand-Archive "$env:RUNNER_TEMP\rclone.zip" $env:RUNNER_TEMP
          $env:Path = "$env:RUNNER_TEMP\$r;$env:Path"
          $dir = 'gdrive:Apps/playroom'
          $have = @(rclone lsf $dir --include '*.exe')
          if ($LASTEXITCODE) { throw "드라이브 목록을 못 읽음 (토큰 비밀값이 아직 살아 있는지)" }
          foreach ($f in Get-ChildItem dist/*.exe) {
            $stem = $f.BaseName
            $name = "$stem-$env:VERSION.exe"
            # 그 도구의 옛 파일(hud.exe 나 hud-<옛 버전>.exe)에 덮어쓰고 이름만 바꿈 — 같은 파일이라 링크가 그대로임
            $old = $have | Where-Object { $_ -eq "$stem.exe" -or $_ -match "^$([regex]::Escape($stem))-[0-9.]+\.exe$" } | Select-Object -First 1
            if (!$old) { $old = $name }
            rclone copyto $f.FullName "$dir/$old"
            if ($LASTEXITCODE) { throw "$stem 을 드라이브에 못 올림" }
            if ($old -ne $name) { rclone moveto "$dir/$old" "$dir/$name" }
            if ($LASTEXITCODE) { throw "$stem 이름을 못 바꿈 (새 exe 는 $old 로 올라가 있음)" }
          }
          rclone lsl $dir | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
      - name: 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$env:VERSION" (Get-ChildItem dist/*.exe).FullName --target $env:GITHUB_SHA `
            --title "v$env:VERSION" --notes-file notes.md
          if ($LASTEXITCODE) { throw "릴리스를 못 만듦" }
