# 윈도우 도구 다섯을 PyInstaller 로 exe 하나씩 굳혀 띄워 보고, 그 버전 태그의 릴리스에 붙임.
# 노트는 CHANGELOG.md 의 그 버전 절을 그대로 씀 — 그 절이 없으면 굽기 전에 멈춤.
# exe 이름은 스크립트 이름을 따름(hud.py → hud.exe). startup.command 와 런처가 이 이름으로 옆의 exe 를 찾음
name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: '버전 (예: 0.1.0). 태그는 v 를 붙여 만듦'
        required: true
permissions:
  contents: write
env:
  PYTHONUTF8: '1'
  VERSION: ${{ inputs.version }}
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: CHANGELOG 에서 노트 꺼내기
        run: |
          $c = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($c, "(?ms)^## $([regex]::Escape($env:VERSION)) .*?(?=^## |\z)")
          if (-not $m.Success) { throw "CHANGELOG.md 에 '## $env:VERSION — 날짜' 절이 없음" }
          $m.Value.Trim() | Set-Content notes.md -Encoding utf8
          Get-Content notes.md
      - run: python -m pip install "pyinstaller>=6.16"
      - name: exe 굽기
        run: |
          $tools = [ordered]@{ launcher = 'launcher/launcher.py'; hud = 'usage-hud/hud.py'; weather = 'weather/weather.py'
                               sysmon = 'sysmon/sysmon.py'; layers = 'layers/layers.py' }
          foreach ($name in $tools.Keys) {
            $extra = if ($name -eq 'hud') { @('--add-data', "$PWD/usage-hud/page.html;.") } else { @() }
            # --specpath 를 build 로 옮기면 상대 경로가 그쪽 기준이 되므로 절대 경로로 넘김
            python -m PyInstaller --noconfirm --onefile --windowed --log-level WARN --name $name `
              --paths "$PWD/shared" --distpath dist --workpath build --specpath build @extra $tools[$name]
            if ($LASTEXITCODE) { throw "$name 굽기 실패" }
          }
          Get-ChildItem dist | ForEach-Object { '{0,-14} {1,6:N1} MB' -f $_.Name, ($_.Length / 1MB) }
      # 창 없는 exe 는 잡히지 않은 예외를 대화상자로만 보이고 멈춤. 오류를 읽으려고 콘솔판을 따로 구워(릴리스엔 안 붙임) 점검함
      - name: 콘솔판 weather.exe --check
        run: |
          python -m PyInstaller --noconfirm --onefile --console --log-level WARN --name weather `
            --paths "$PWD/shared" --distpath build/console --workpath build/console-work --specpath build/console-work weather/weather.py
          if ($LASTEXITCODE) { throw "콘솔판 굽기 실패" }
          build/console/weather.exe --check
          if ($LASTEXITCODE) { throw "콘솔판 weather.exe --check 실패 (종료 코드 $LASTEXITCODE)" }
      # 창 없는 exe 가 부모가 준 파이프로 stdout 을 쓰는지 — weather 설정 창이 이 길로 누른 것을 돌려보냄
      - name: 창 없는 weather.exe --check (stdout 을 파일로)
        run: |
          $p = Start-Process dist/weather.exe -ArgumentList '--check' -PassThru -RedirectStandardOutput check.out -RedirectStandardError check.err
          $null = $p.Handle
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; throw "60초 안에 안 끝남 — 오류 대화상자에 멈췄을 수 있음" }
          Get-Content check.out, check.err
          if ($p.ExitCode -ne 0 -or -not (Select-String -Quiet '자체 점검 통과' check.out)) { throw "stdout 이 파이프로 안 나감 (종료 코드 $($p.ExitCode))" }
      # 창 없는 exe 는 죽으면 오류 대화상자를 띄운 채 살아 있으므로, 살아 있는 것만 보지 않고 트레이 창이 떴는지 봄
      - name: exe 띄워 보기
        run: |
          Add-Type -Namespace U -Name W -MemberDefinition '[DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindow(string c, string n);'
          $tray = [ordered]@{ hud = 'PlayroomUsageHudTray'; weather = 'PlayroomWeatherTray'; sysmon = 'PlayroomSysmonTray'; layers = 'PlayroomLayersTray' }
          foreach ($name in $tray.Keys) {
            $p = Start-Process "dist/$name.exe" -PassThru
            $null = $p.Handle  # 먼저 잡아 두지 않으면 끝난 뒤 ExitCode 가 빈다
            Start-Sleep 8
            if ($p.HasExited) { throw "$name.exe 가 뜨다 죽음 (종료 코드 $($p.ExitCode))" }
            if ([U.W]::FindWindow($tray[$name], $null) -eq [IntPtr]::Zero) { throw "$name.exe 의 트레이 창이 없음 — 오류 대화상자에 멈췄을 수 있음" }
            $s = Start-Process "dist/$name.exe" -ArgumentList '--stop' -PassThru
            if (-not $s.WaitForExit(15000)) { throw "$name.exe --stop 이 안 끝남" }
            if (-not $p.WaitForExit(10000)) { throw "$name.exe 가 --stop 으로 안 꺼짐" }
            "$name.exe 뜨고 꺼짐"
          }
          $p = Start-Process dist/launcher.exe -PassThru
          $null = $p.Handle
          Start-Sleep 8
          if ($p.HasExited) { throw "launcher.exe 가 뜨다 죽음 (종료 코드 $($p.ExitCode))" }
          if ([U.W]::FindWindow($null, 'playroom') -eq [IntPtr]::Zero) { throw "launcher.exe 창이 없음 — 오류 대화상자에 멈췄을 수 있음" }
          Stop-Process -Id $p.Id
          "launcher.exe 뜸"
      - name: 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$env:VERSION" (Get-ChildItem dist/*.exe).FullName --target $env:GITHUB_SHA `
            --title "v$env:VERSION" --notes-file notes.md
          if ($LASTEXITCODE) { throw "릴리스를 못 만듦" }
