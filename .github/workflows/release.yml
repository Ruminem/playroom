# 윈도우 도구 다섯을 PyInstaller 로 exe 하나씩 굳혀 띄워 보고, 그 버전 태그의 릴리스에 붙임.
# 노트는 CHANGELOG.md 의 그 버전 절을 그대로 씀 — 그 절이 없으면 굽기 전에 멈춤.
# exe 이름은 스크립트 이름을 따름(hud.py → hud.exe). startup.command 와 런처가 이 이름으로 옆의 exe 를 찾음
# 굳힌 exe 는 PYTHONUTF8 환경 변수를 안 읽어서, 한글을 찍으면 cp1252 로 죽음(2026-10-05 CI). 그래서 UTF-8 모드를 exe 에 박음
name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: '버전 (예: 0.1.0). 태그는 v 를 붙여 만듦'
        required: true
permissions:
  contents: write
env:
  PYTHONUTF8: '1'
  VERSION: ${{ inputs.version }}
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: CHANGELOG 에서 노트 꺼내기
        run: |
          $c = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($c, "(?ms)^## $([regex]::Escape($env:VERSION)) .*?(?=^## |\z)")
          if (-not $m.Success) { throw "CHANGELOG.md 에 '## $env:VERSION — 날짜' 절이 없음" }
          $m.Value.Trim() | Set-Content notes.md -Encoding utf8
          Get-Content notes.md
      - run: python -m pip install "pyinstaller>=6.16"
      - name: exe 굽기
        run: |
          $tools = [ordered]@{ launcher = 'launcher/launcher.py'; hud = 'usage-hud/hud.py'; weather = 'weather/weather.py'
                               sysmon = 'sysmon/sysmon.py'; layers = 'layers/layers.py' }
          foreach ($name in $tools.Keys) {
            $extra = if ($name -eq 'hud') { @('--add-data', "$PWD/usage-hud/page.html;.") } else { @() }
            # --specpath 를 build 로 옮기면 상대 경로가 그쪽 기준이 되므로 절대 경로로 넘김
            python -m PyInstaller --noconfirm --onefile --windowed --log-level WARN --name $name --python-option 'X utf8' `
              --paths "$PWD/shared" --distpath dist --workpath build --specpath build @extra $tools[$name]
            if ($LASTEXITCODE) { throw "$name 굽기 실패" }
          }
          Get-ChildItem dist | ForEach-Object { '{0,-14} {1,6:N1} MB' -f $_.Name, ($_.Length / 1MB) }
      # 창 없는 exe 는 잡히지 않은 예외를 대화상자로만 보이고 멈춤. 오류를 읽으려고 콘솔판을 따로 구워(릴리스엔 안 붙임) 점검함
      - name: 콘솔판 weather.exe --check
        run: |
          python -m PyInstaller --noconfirm --onefile --console --log-level WARN --name weather --python-option 'X utf8' `
            --paths "$PWD/shared" --distpath build/console --workpath build/console-work --specpath build/console-work weather/weather.py
          if ($LASTEXITCODE) { throw "콘솔판 굽기 실패" }
          build/console/weather.exe --check
          if ($LASTEXITCODE) { throw "콘솔판 weather.exe --check 실패 (종료 코드 $LASTEXITCODE)" }
      # 창 없는 exe 가 부모가 준 파이프로 stdout 을 쓰는지 — weather 설정 창이 이 길로 누른 것을 돌려보냄
      - name: 창 없는 weather.exe --check (stdout 을 파일로)
        run: |
          $p = Start-Process dist/weather.exe -ArgumentList '--check' -PassThru -RedirectStandardOutput check.out -RedirectStandardError check.err
          $null = $p.Handle
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; throw "60초 안에 안 끝남 — 오류 대화상자에 멈췄을 수 있음" }
          Get-Content check.out, check.err
          if ($p.ExitCode -ne 0 -or -not (Select-String -Quiet '자체 점검 통과' check.out)) { throw "stdout 이 파이프로 안 나감 (종료 코드 $($p.ExitCode))" }
      # 창 없는 exe 는 죽으면 오류 대화상자를 띄운 채 살아 있으므로, 살아 있는 것만 보지 않고 트레이 창이 떴는지 봄.
      # onefile 은 풀어 놓는 데만 몇 초 걸리므로 정해진 시간을 자지 않고 30초까지 1초마다 찾음
      - name: exe 띄워 보기
        run: |
          Add-Type -Namespace U -Name W -MemberDefinition @'
          [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindow(string c, string n);
          public delegate bool EnumProc(IntPtr h, IntPtr l);
          [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc f, IntPtr l);
          [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
          [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetClassName(IntPtr h, System.Text.StringBuilder s, int n);
          [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, System.Text.StringBuilder s, int n);
          public static System.Collections.Generic.List<string> Of(uint[] pids) {
            var r = new System.Collections.Generic.List<string>();
            EnumWindows((h, l) => { uint p; GetWindowThreadProcessId(h, out p);
              if (System.Array.IndexOf(pids, p) >= 0) { var c = new System.Text.StringBuilder(256); var t = new System.Text.StringBuilder(256);
                GetClassName(h, c, 256); GetWindowText(h, t, 256); r.Add(p + " " + c + " '" + t + "'"); }
              return true; }, IntPtr.Zero);
            return r;
          }
          '@
          function Wait-Window($class, $title) {
            $t = [Diagnostics.Stopwatch]::StartNew()
            while ($t.Elapsed.TotalSeconds -lt 30) {
              if ([U.W]::FindWindow($class, $title) -ne [IntPtr]::Zero) { return $t.Elapsed.TotalSeconds }
              Start-Sleep 1
            }
            return $null
          }
          function Show-Windows($proc) {  # 대화상자에 멈췄으면 그 창이 여기 보임
            $ids = [uint32[]]@(Get-Process $proc -ErrorAction SilentlyContinue | ForEach-Object Id)
            "$proc 프로세스 $($ids -join ', ') 의 창:"; [U.W]::Of($ids)
            Get-ChildItem $env:TEMP -Filter 'playroom-*.log' | ForEach-Object { "--- $($_.Name)"; Get-Content $_.FullName -Tail 40 }
          }
          $tray = [ordered]@{ hud = 'PlayroomUsageHudTray'; weather = 'PlayroomWeatherTray'; sysmon = 'PlayroomSysmonTray'; layers = 'PlayroomLayersTray' }
          foreach ($name in $tray.Keys) {
            $p = Start-Process "dist/$name.exe" -PassThru
            $null = $p.Handle  # 먼저 잡아 두지 않으면 끝난 뒤 ExitCode 가 빈다
            $sec = Wait-Window $tray[$name] $null
            if ($p.HasExited) { throw "$name.exe 가 뜨다 죽음 (종료 코드 $($p.ExitCode))" }
            if ($null -eq $sec) {
              Show-Windows $name
              # 기준선: 같은 도구를 굳히지 않은 파이썬으로 띄워도 트레이가 없는지
              $src = @{ hud = 'usage-hud/hud.py'; weather = 'weather/weather.py'; sysmon = 'sysmon/sysmon.py'; layers = 'layers/layers.py' }[$name]
              $q = Start-Process python -ArgumentList $src -PassThru
              $base = Wait-Window $tray[$name] $null
              "파이썬으로 띄운 $src 의 트레이: $(if ($null -eq $base) { '30초 안에 없음' } else { '{0:N1}초' -f $base })"
              if (-not $q.HasExited) { Stop-Process -Id $q.Id -Force }
              throw "$name.exe 의 트레이 창이 30초 안에 안 뜸"
            }
            "$name.exe 트레이 {0:N1}초" -f $sec
            $s = Start-Process "dist/$name.exe" -ArgumentList '--stop' -PassThru
            if (-not $s.WaitForExit(15000)) { throw "$name.exe --stop 이 안 끝남" }
            if (-not $p.WaitForExit(10000)) { throw "$name.exe 가 --stop 으로 안 꺼짐" }
            "$name.exe 꺼짐"
          }
          $p = Start-Process dist/launcher.exe -PassThru
          $null = $p.Handle
          $sec = Wait-Window $null 'playroom'
          if ($p.HasExited) { throw "launcher.exe 가 뜨다 죽음 (종료 코드 $($p.ExitCode))" }
          if ($null -eq $sec) { Show-Windows launcher; throw "launcher.exe 창이 30초 안에 안 뜸" }
          "launcher.exe 창 {0:N1}초" -f $sec
          Get-Process launcher | Stop-Process
      - name: 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$env:VERSION" (Get-ChildItem dist/*.exe).FullName --target $env:GITHUB_SHA `
            --title "v$env:VERSION" --notes-file notes.md
          if ($LASTEXITCODE) { throw "릴리스를 못 만듦" }
